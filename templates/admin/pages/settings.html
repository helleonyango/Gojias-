{{define "content"}}
{{with .Data.Settings}}
<form class="admin-form" method="post" action="/admin/settings" style="margin-bottom:1.5rem">
  <input type="hidden" name="csrf" value="{{$.CSRF}}">
  <h2 style="font-size:1.1rem;margin-top:0">Business details</h2>
  <div class="form-grid">
    <div class="field">
      <label for="business_name">Business name</label>
      <input id="business_name" type="text" name="business_name" maxlength="80" value="{{.BusinessName}}" required>
    </div>
    <div class="field">
      <label for="whatsapp">WhatsApp number <span class="hint-inline">digits only, international</span></label>
      <input id="whatsapp" type="text" name="whatsapp" maxlength="15" value="{{.WhatsApp}}" placeholder="254724715509" required>
    </div>
    <div class="field">
      <label for="phone">Phone (displayed)</label>
      <input id="phone" type="text" name="phone" maxlength="40" value="{{.Phone}}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" maxlength="120" value="{{.Email}}" required>
    </div>
    <div class="field">
      <label for="address">Workshop address</label>
      <input id="address" type="text" name="address" maxlength="160" value="{{.Address}}">
    </div>
    <div class="field">
      <label for="hours">Opening hours</label>
      <input id="hours" type="text" name="hours" maxlength="160" value="{{.Hours}}">
    </div>
  </div>

  <label class="checkbox"><input type="checkbox" name="notify_email" value="1"{{if .NotifyEmail}} checked{{end}}> Email the shop when a new order arrives</label>
  <p class="help-text">Email also needs SMTP_HOST, SMTP_USER, SMTP_PASS and MAIL_TO in the server environment. Without them, notifications are written to the server log.</p>

  <div class="admin-form-actions">
    <button class="btn btn-primary" type="submit">Save settings</button>
  </div>
</form>
{{end}}

<form class="admin-form" method="post" action="/admin/settings/password">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <h2 style="font-size:1.1rem;margin-top:0">Change password</h2>
  <div class="form-grid">
    <div class="field">
      <label for="current_password">Current password</label>
      <input id="current_password" type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password <span class="hint-inline">at least 8 characters</span></label>
      <input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </div>
  </div>
  <div class="admin-form-actions">
    <button class="btn btn-primary" type="submit">Update password</button>
  </div>
</form>
{{end}}
